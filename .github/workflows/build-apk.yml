name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "xiaozhangben-optimized.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract source
        run: |
          mkdir -p app
          unzip -q xiaozhangben-optimized.zip -d app

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install --no-save \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3

      - name: Create Capacitor config
        working-directory: app
        run: |
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.xiaozhangben.app',
            appName: '小账本',
            webDir: 'dist',
            android: {
              allowMixedContent: false
            }
          };

          export default config;
          EOF

      - name: Add Android project
        working-directory: app
        run: npx cap add android

      - name: Sync Android project
        working-directory: app
        run: npx cap sync android

      - name: Build APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -f app/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhangben-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
