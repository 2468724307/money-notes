name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract optimized web app
        run: |
          rm -rf app
          mkdir -p app
          unzip -q source/xiaozhangben-optimized.zip -d app
          test -f app/package.json

      - name: Install web dependencies
        working-directory: app
        run: npm install

      - name: Configure TanStack Start for static APK build
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("vite.config.ts")
          s = p.read_text(encoding="utf-8")
          old = "    tanstackStart(),"
          new = '''    tanstackStart({
              spa: {
                prerender: {
                  outputPath: "/index.html",
                  crawlLinks: false,
                  retryCount: 0,
                },
              },
            }),'''
          if old not in s:
              raise SystemExit("Could not find tanstackStart() in vite.config.ts")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY
          grep -n -A10 -B2 "tanstackStart" vite.config.ts

      - name: Build static web app for Capacitor
        working-directory: app
        env:
          NODE_ENV: production
        run: npm run build

      - name: Prepare Capacitor web assets
        working-directory: app
        run: |
          rm -rf capacitor-web
          mkdir -p capacitor-web

          if [ -f .output/public/index.html ]; then
            cp -a .output/public/. capacitor-web/
          elif [ -f .output/public/_shell.html ]; then
            cp -a .output/public/. capacitor-web/
            mv capacitor-web/_shell.html capacitor-web/index.html
          elif [ -f dist/index.html ]; then
            cp -a dist/. capacitor-web/
          else
            echo "ERROR: no static index.html found after TanStack Start build"
            echo "Candidates under .output:"
            find .output -maxdepth 5 -type f \( -name 'index.html' -o -name '_shell.html' \) -print 2>/dev/null || true
            echo "Top-level build output:"
            find .output -maxdepth 2 -type d -print 2>/dev/null || true
            exit 1
          fi

          test -s capacitor-web/index.html
          echo "Capacitor web root: $(pwd)/capacitor-web"
          find capacitor-web -maxdepth 2 -type f | head -80

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install --no-save \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3

      - name: Create Capacitor configuration
        working-directory: app
        run: |
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.xiaozhangben.app',
            appName: '小账本',
            webDir: 'capacitor-web',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF2

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: app
        run: npx cap sync android

      - name: Verify Android project
        working-directory: app
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          ./android/gradlew --version

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        working-directory: app
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhangben-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhangben-bu
