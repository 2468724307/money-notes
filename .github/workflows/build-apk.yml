name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract optimized web app
        run: |
          rm -rf app
          mkdir -p app

          echo "Searching for optimized web app ZIP..."
          ZIP_FILE=$(find . -type f \( \
            -name 'xiaozhangben-optimized.zip' \
            -o -name 'xiaozhangben-optimized*.zip' \
          \) -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: xiaozhangben-optimized.zip was not found."
            echo "Repository files:"
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d app

          echo "Checking extracted project..."
          find app -maxdepth 2 -type f | sort | head -100

          test -f app/package.json

      - name: Install web dependencies
        working-directory: app
        run: npm install

      - name: Configure TanStack Start for static APK build
        working-directory: app
        run: |
          node <<'NODE'
          const fs = require('fs');

          const file = 'vite.config.ts';
          let s = fs.readFileSync(file, 'utf8');

          const oldText = 'tanstackStart(),';

          const newText = `tanstackStart({
            spa: {
              enabled: true,
              prerender: {
                outputPath: '/index.html',
                crawlLinks: false,
                retryCount: 1,
              },
            },
          }),`;

          if (!s.includes(oldText)) {
            console.error('Could not find tanstackStart() in vite.config.ts');
            process.exit(1);
          }

          s = s.replace(oldText, newText);
          fs.writeFileSync(file, s);

          console.log('TanStack Start SPA mode enabled.');
          NODE
          
      - name: Build static web app for Capacitor
        working-directory: app
        env:
          NODE_ENV: production
        run: |
          set -e
          echo "Running production build..."
          npm run build
          echo "=== After build: top-level dirs ==="
          ls -la
          echo "=== Looking for output ==="
          find . -maxdepth 3 \( -type d -name '.output' -o -type d -name 'dist' -o -name 'index.html' -o -name '_shell.html' \) 2>/dev/null | head -50 || true

      - name: Prepare Capacitor web assets
        working-directory: app
        run: |
          set -e

          echo "=== Build output tree (debug) ==="
          find . -maxdepth 4 \( -type d -name '.output' -o -type d -name 'dist' -o -type d -name 'build' -o -name 'index.html' -o -name '_shell.html' \) 2>/dev/null | head -100 || true
          ls -la . 2>/dev/null || true

          rm -rf capacitor-web
          mkdir -p capacitor-web

          CANDIDATES=(
            ".output/public"
            ".output"
            "dist/client"
            "dist"
            "build/client"
            "build"
          )

          WEB_ROOT=""
          INDEX=""

          for dir in "${CANDIDATES[@]}"; do
            if [ -d "$dir" ]; then
              if [ -f "$dir/index.html" ]; then
                WEB_ROOT="$dir"
                INDEX="$dir/index.html"
                break
              elif [ -f "$dir/_shell.html" ]; then
                WEB_ROOT="$dir"
                INDEX="$dir/_shell.html"
                break
              fi
            fi
          done

          if [ -z "$INDEX" ]; then
            INDEX=$(find . -type f \( -name 'index.html' -o -name '_shell.html' \) \
              ! -path './node_modules/*' ! -path './.git/*' 2>/dev/null | head -1)
            if [ -n "$INDEX" ]; then
              WEB_ROOT=$(dirname "$INDEX")
            fi
          fi

          if [ -z "$INDEX" ] || [ ! -f "$INDEX" ]; then
            echo "ERROR: no index.html / _shell.html found after build."
            echo "Full tree under app (maxdepth 5):"
            find . -maxdepth 5 -type f ! -path './node_modules/*' | sort | head -300
            exit 1
          fi

          echo "Found static shell: $INDEX"
          echo "Web root: $WEB_ROOT"

          if [ -d "$WEB_ROOT" ]; then
            cp -r "$WEB_ROOT"/. capacitor-web/
          fi

          if [ ! -f capacitor-web/index.html ]; then
            if [ -f "$INDEX" ]; then
              cp "$INDEX" capacitor-web/index.html
            elif [ -f capacitor-web/_shell.html ]; then
              cp capacitor-web/_shell.html capacitor-web/index.html
            fi
          fi

          echo "=== Capacitor web assets ==="
          find capacitor-web -maxdepth 3 -type f | sort | head -100
          test -f capacitor-web/index.html
          echo "Prepare OK"

      - name: Install Capacitor
        working-directory: app
        run: |
          npm install --no-save \
            @capacitor/core@7.4.3 \
            @capacitor/cli@7.4.3 \
            @capacitor/android@7.4.3

      - name: Create Capacitor configuration
        working-directory: app
        run: |
          cat > capacitor.config.ts <<'EOF2'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.xiaozhangben.app',
            appName: '小账本',
            webDir: 'capacitor-web',
            bundledWebRuntime: false,
            server: {
              androidScheme: 'https'
            }
          };

          export default config;
          EOF2

      - name: Add Android platform
        working-directory: app
        run: npx cap add android

      - name: Sync web assets to Android
        working-directory: app
        run: npx cap sync android

      - name: Verify Android project
        working-directory: app
        run: |
          test -f android/gradlew
          test -f android/app/src/main/AndroidManifest.xml
          chmod +x android/gradlew
          ./android/gradlew --version

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        working-directory: app
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "APK: $APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhangben-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhangben-build-meta
          path: |
            app/capacitor.config.ts
            app/package.json
          if-no-files-found: warn
          retention-days: 14
